<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin | Urban Moda</title>

  <link rel="stylesheet" href="./css/styles.css">
</head>

<body>

  <main class="container">

    <h1>Panel Admin</h1>

    <form id="productoForm">

      <input
        type="text"
        id="productName"
        placeholder="Nombre producto"
        required
      >

      <select id="productCategory" required>
        <option value="">Selecciona una categoría</option>
        <option value="4">Camisas</option>
        <option value="3">Pantalones</option>
        <option value="2">Buzos</option>
        <option value="5">Chaquetas</option>
        <option value="6">Blusas</option>
        <option value="7">Faldas</option>
      </select>

      <input
        type="number"
        id="productPrice"
        placeholder="Precio"
        required
      >

      <input
        type="text"
        id="productImage"
        placeholder="URL de imagen"
      >

      <button type="submit">
        Guardar producto
      </button>

    </form>

    <h2>Productos registrados</h2>

    <section id="adminProducts" class="product-grid"></section>

  </main>

  <script src="./js/admin.js?v=200"></script>

</body>
</html>
