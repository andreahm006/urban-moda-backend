<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Urban Moda</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="navbar">
    <a class="logo" href="index.html">URBAN<span>MODA</span></a>
    <button class="menu-btn" id="menuBtn">☰</button>
    <nav id="menu">
      <a href="index.html">Inicio</a>
      <a href="productos.html">Productos</a>
      <a href="registro.html">Registro</a>
    </nav>
  </header>

  <main class="auth-page">
    <section class="auth-info">
      <p class="tag">Bienvenido de nuevo</p>
      <h1>Ingresa y sigue armando tu estilo</h1>
      <p>Este formulario consume la ruta <strong>/auth/login</strong> de tu API local.</p>
    </section>

    <section class="form-card">
      <h2>Iniciar sesión</h2>
      <form id="loginForm">
        <label for="email">Correo</label>
        <input type="email" id="email" value="admin@tienda.com" required>

        <label for="password">Contraseña</label>
        <input type="password" id="password" value="Password1234!" required>

        <button type="submit" class="btn-primary full">Ingresar</button>
      </form>
      <p id="mensaje" class="mensaje"></p>
      <p class="small">¿No tienes cuenta? <a href="registro.html">Crear cuenta</a></p>
    </section>
  </main>

  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
