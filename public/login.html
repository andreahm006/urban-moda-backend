<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Urban Moda</title>
  <link rel="stylesheet" href="./css/styles.css?v=400">
</head>

<body>
  <header class="navbar">
    <a class="logo" href="index.html">URBAN<span>MODA</span></a>

    <nav id="menu">
      <a href="index.html">Inicio</a>
      <a href="productos.html">Productos</a>

      <a href="carrito.html">
        Carrito <span id="cartCount" class="badge">0</span>
      </a>

      <a href="admin.html" id="adminLink" class="hidden">Admin</a>
      <a href="registro.html" id="registerLink">Registro</a>

      <a href="login.html" class="btn-nav" id="loginLink">Ingresar</a>
      <button class="logout-btn hidden" id="logoutBtn">Salir</button>
    </nav>
  </header>

  <main class="auth-page">
    <section class="auth-text">
      <p class="tag">BIENVENIDO DE NUEVO</p>
      <h1>Ingresa y sigue armando tu estilo</h1>
      <p>
        Accede con tu usuario cliente para comprar, guardar productos en el carrito
        y finalizar tus pedidos.
      </p>
    </section>

    <section class="auth-card">
      <h2>Iniciar sesión</h2>

      <form id="loginForm">
        <label for="email">Correo</label>
        <input
          type="email"
          id="email"
          placeholder="correo@ejemplo.com"
          required
        >

        <label for="password">Contraseña</label>
        <input
          type="password"
          id="password"
          placeholder="Contraseña"
          required
        >

        <button type="submit" class="auth-button">
          Ingresar
        </button>
      </form>

      <p id="message"></p>

      <p class="auth-link">
        ¿No tienes cuenta?
        <a href="registro.html" id="registerButton">Crear cuenta</a>
      </p>
    </section>
  </main>

  <script src="./js/api.js"></script>
  <script src="./js/main.js?v=305"></script>
  <script src="./js/login.js?v=305"></script>
</body>
</html>
