<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro | Urban Moda</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="navbar">
    <a class="logo" href="index.html">URBAN<span>MODA</span></a>
    <button class="menu-btn" id="menuBtn">☰</button>
    <nav id="menu">
      <a href="index.html">Inicio</a>
      <a href="productos.html">Productos</a>
      <a href="login.html">Login</a>
    </nav>
  </header>

  <main class="container">
    <section class="section-title center">
      <p class="tag">Registro</p>
      <h1>Crear cuenta</h1>
      <p>Datos básicos del usuario y cliente.</p>
    </section>

    <section class="form-card wide centered">
      <form id="registroForm" class="grid-form">
        <div>
          <label for="name">Nombre</label>
          <input type="text" id="name" placeholder="Andrea" required>
        </div>
        <div>
          <label for="lastName">Apellido</label>
          <input type="text" id="lastName" placeholder="Gómez" required>
        </div>
        <div>
          <label for="email">Correo</label>
          <input type="email" id="email" placeholder="correo@ejemplo.com" required>
        </div>
        <div>
          <label for="password">Contraseña</label>
          <input type="password" id="password" placeholder="Password1234!" required>
        </div>
        <div>
          <label for="phone">Teléfono</label>
          <input type="text" id="phone" placeholder="3000000000">
        </div>
        <div>
          <label for="address">Dirección</label>
          <input type="text" id="address" placeholder="Calle 123">
        </div>
        <button type="submit" class="btn-primary full grid-full">Registrar usuario</button>
      </form>
      <p id="mensaje" class="mensaje"></p>
    </section>
  </main>

  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script src="js/registro.js"></script>
</body>
</html>
