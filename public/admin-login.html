<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Admin | Urban Moda</title>
  <link rel="stylesheet" href="./css/styles.css?v=306">
</head>

<body>
  <header class="navbar">
    <a class="logo" href="index.html">URBAN<span>MODA</span></a>

    <nav id="menu">
      <a href="index.html">Inicio</a>
      <a href="productos.html">Productos</a>
      <a href="login.html" class="btn-nav">Login cliente</a>
    </nav>
  </header>

  <main class="auth-page">
    <section class="auth-text">
      <p class="tag">ACCESO ADMINISTRATIVO</p>
      <h1>Panel privado de gestión</h1>
      <p>
        Esta sección es exclusiva para usuarios administradores.
        Desde aquí se gestionan los productos de Urban Moda.
      </p>
    </section>

    <section class="auth-card">
      <h2>Ingresar como admin</h2>

      <form id="adminLoginForm">
        <label for="email">Correo administrador</label>
        <input
          type="email"
          id="email"
          placeholder="admin@tienda.com"
          required
        >

        <label for="password">Contraseña</label>
        <input
          type="password"
          id="password"
          placeholder="Contraseña"
          required
        >

        <button type="submit" class="auth-button">
          Entrar al panel
        </button>
      </form>

      <p id="message"></p>

      <p class="auth-link">
        ¿Eres cliente?
        <a href="login.html">Ir al login de clientes</a>
      </p>
    </section>
  </main>

  <script src="./js/api.js"></script>
  <script src="./js/admin-login.js?v=101"></script>
</body>
</html>
