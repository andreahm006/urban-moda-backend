<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Productos | Urban Moda</title>
  <link rel="stylesheet" href="./css/styles.css?v=306">
</head>

<body>
  <header class="navbar">
    <a class="logo" href="index.html">URBAN<span>MODA</span></a>

    <nav id="menu">
      <a href="index.html">Inicio</a>
      <a href="productos.html">Productos</a>

      <a href="carrito.html" id="cartLink">
        Carrito <span id="cartCount" class="badge">0</span>
      </a>

      <a href="admin.html" id="adminLink" class="hidden">Admin</a>

      <a href="login.html" class="btn-nav" id="loginLink">Ingresar</a>
      <button class="logout-btn hidden" id="logoutBtn">Salir</button>
    </nav>
  </header>

  <main class="container">
    <section class="section-title">
      <span id="catalogTag">CATÁLOGO</span>
      <h1 id="catalogTitle">Productos disponibles</h1>
      <p id="catalogDescription">
        Prendas con estilo urbano, colores neutros y uso familiar.
      </p>
    </section>

    <section class="filters">
      <input
        type="text"
        id="searchInput"
        placeholder="Buscar producto..."
      >

      <select id="categoryFilter">
        <option value="todos">Todas las categorías</option>
        <option value="Camisas">Camisas</option>
        <option value="Pantalones">Pantalones</option>
        <option value="Buzos">Buzos</option>
        <option value="Chaquetas">Chaquetas</option>
        <option value="Blusas">Blusas</option>
        <option value="Faldas">Faldas</option>
        <option value="outlet">Outlet</option>
      </select>
    </section>

    <section id="productsGrid" class="product-grid"></section>
  </main>

  <script src="./js/api.js"></script>
  <script src="./js/main.js?v=306"></script>
  <script src="./js/productos.js?v=107"></script>
</body>
</html>
