<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pasarela de pago | Urban Moda</title>
  <link rel="stylesheet" href="./css/styles.css?v=401">
</head>

<body>
  <header class="navbar">
    <a class="logo" href="index.html">URBAN<span>MODA</span></a>

    <nav id="menu">
      <a href="index.html">Inicio</a>
      <a href="productos.html">Productos</a>

      <a href="carrito.html" id="cartLink">
        Carrito <span id="cartCount" class="badge">0</span>
      </a>

      <a href="admin.html" id="adminLink" class="hidden">Admin</a>

      <a href="login.html" class="btn-nav" id="loginLink">Ingresar</a>
      <button class="logout-btn hidden" id="logoutBtn">Salir</button>
    </nav>
  </header>

  <main class="auth-page">
    <section class="auth-text">
      <p class="tag">PAGO EN LÍNEA</p>
      <h1>Confirma tu pago de forma segura</h1>
      <p>
        Completa la información de pago para finalizar tu compra en Urban Moda.
      </p>
    </section>

    <section class="auth-card">
      <h2>Datos de pago</h2>

      <div id="orderSummary"></div>

      <form id="paymentForm">
        <label for="cardName">Nombre del titular</label>
        <input
          type="text"
          id="cardName"
          placeholder="Nombre completo"
          required
        >

        <label for="cardNumber">Número de tarjeta</label>
        <input
          type="text"
          id="cardNumber"
          placeholder="0000 0000 0000 0000"
          maxlength="19"
          required
        >

        <label for="expiry">Fecha de vencimiento</label>
        <input
          type="text"
          id="expiry"
          placeholder="MM/AA"
          maxlength="5"
          required
        >

        <label for="cvv">CVV</label>
        <input
          type="password"
          id="cvv"
          placeholder="123"
          maxlength="4"
          required
        >

        <button type="submit" class="auth-button">
          Confirmar pago
        </button>
      </form>

      <p id="message"></p>
    </section>
  </main>

  <footer>
    <p>Urban Moda · Tienda de moda virtual</p>
  </footer>

  <script src="./js/api.js"></script>
  <script src="./js/main.js?v=306"></script>
  <script src="./js/pasarela.js?v=102"></script>
</body>
</html>
