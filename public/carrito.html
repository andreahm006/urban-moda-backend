<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrito | Urban Moda</title>
  <link rel="stylesheet" href="./css/styles.css?v=400">
</head>

<body>
  <header class="navbar">
    <a class="logo" href="index.html">URBAN<span>MODA</span></a>

    <nav id="menu">
      <a href="index.html">Inicio</a>
      <a href="productos.html">Productos</a>
      <a href="carrito.html">
        Carrito <span id="cartCount" class="badge">0</span>
      </a>

      <a href="admin.html" id="adminLink" class="hidden">Admin</a>

      <a href="login.html" class="btn-nav" id="loginLink">Ingresar</a>

      <button class="logout-btn hidden" id="logoutBtn">
        Salir
      </button>
    </nav>
  </header>

  <main class="container">
    <section class="section-title">
      <span>CARRITO</span>
      <h1>Tu carrito de compras</h1>
      <p>Revisa los productos seleccionados antes de finalizar tu compra.</p>
    </section>

    <section class="cart-container">
      <div id="carritoLista"></div>

      <div class="cart-summary">
        <div class="coupon-box">
          <input
            type="text"
            id="cupon"
            placeholder="Cupón de descuento"
          >

          <button type="button" id="aplicarCupon">
            Aplicar cupón
          </button>
        </div>

        <div class="payment-box">
          <h3>Método de pago</h3>

          <select id="paymentMethod">
            <option value="">Selecciona un método de pago</option>
            <option value="contraentrega">Pago contra entrega</option>
            <option value="online">Pago en línea</option>
          </select>

          <p id="paymentInfo"></p>
        </div>

        <div class="total-box">
          <p>
            <strong>Subtotal:</strong>
            <span id="subtotal">$ 0</span>
          </p>

          <p>
            <strong>Total:</strong>
            <span id="total">$ 0</span>
          </p>
        </div>

        <div class="cart-actions">
          <button type="button" id="vaciarCarrito">
            Vaciar carrito
          </button>

          <button type="button" id="finalizarCompra">
            Finalizar compra
          </button>
        </div>
      </div>
    </section>
  </main>

  <script src="./js/api.js"></script>
  <script src="./js/main.js?v=305"></script>
  <script src="./js/carrito.js?v=108"></script>
</body>
</html>
