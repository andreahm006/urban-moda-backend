<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Urban Moda | Catálogo</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="header">
    <nav class="navbar">
      <a class="logo" href="index.html">Urban Moda</a>
      <button class="menu-btn" id="menuBtn">☰</button>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">Inicio</a></li>
        <li><a href="productos.html">Catálogo</a></li>
        <li><a href="carrito.html">Carrito</a></li>
        <li><a href="admin.html">Administrador</a></li>
      </ul>
    </nav>
  </header>

  <main class="section page">
    <h1>Catálogo Urban Moda</h1>
    <p class="lead">Consulta de productos disponibles para los usuarios finales.</p>

    <div class="filters">
      <input id="searchInput" type="text" placeholder="Buscar producto..." />
      <select id="categoryFilter">
        <option value="todos">Todas las categorías</option>
        <option value="camisas">Camisas</option>
        <option value="pantalones">Pantalones</option>
        <option value="buzos">Buzos</option>
        <option value="chaquetas">Chaquetas</option>
      </select>
    </div>

    <section class="product-grid" id="productGrid"></section>
  </main>

  <footer class="footer">
    <p>Urban Moda - Proyecto formativo SENA</p>
  </footer>
  <script src="js/main.js"></script>
  <script src="js/productos.js"></script>
</body>
</html>
